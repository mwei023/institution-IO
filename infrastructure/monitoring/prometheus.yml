global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: institution-os

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
